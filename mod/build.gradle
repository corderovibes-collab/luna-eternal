plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'java'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

// El mod es SOLO de servidor. No hay src/client, asi que no hace falta
// splitEnvironmentSourceSets(): se retiro junto con el Pad, y volvera el dia
// que se escriba la interfaz nueva (D-025-bis).

repositories {
    mavenCentral()
    // Cobblemon se publica aquí. Se usa la MISMA version que corre el
    // servidor (1.7.3); el `main` del repositorio va por 1.8.0 y su API
    // puede diferir.
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Cobblemon: SOLO para compilar. No se empaqueta ni se incluye — el
    // servidor ya lo tiene, y meterlo en nuestro jar seria duplicar 130 MB
    // y arriesgarse a que dos versiones convivan.
    modCompileOnly "maven.modrinth:cobblemon:${project.cobblemon_version}"

    // Cobblemon esta escrito en Kotlin y sus firmas usan tipos de Kotlin
    // (Function1). Sin el stdlib, el compilador de Java no puede resolver
    // que sobrecarga de subscribe() estamos llamando.
    // compileOnly: Cobblemon ya empaqueta Kotlin, no hay que duplicarlo.
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"

    // Persistencia (D-009). Van DENTRO del jar: el servidor no tiene classpath propio.
    // HikariCP  Apache-2.0        — compatible con uso comercial (D-008)
    // MariaDB   LGPL-2.1          — enlace dinámico, sin modificar. Compatible
    include(implementation("com.zaxxer:HikariCP:${project.hikaricp_version}"))
    include(implementation("org.mariadb.jdbc:mariadb-java-client:${project.mariadb_version}"))
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

