plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'java'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

// El mod vuelve a tener lado de cliente: el PokePad (D-025). Vive AQUI y no en
// `lunaneon` porque necesita hablar con la economia, el GTS y las misiones, que
// estan en este mod. `lunaneon` se separo para que el jar de bloques no llevara
// nada de eso dentro, y sigue siendo cierto.
//
// `splitEnvironmentSourceSets()` crea el conjunto `client`, que Loom compila
// contra el jar de cliente. Lo que se escriba ahi NO existe en el servidor, y
// es justo lo que se quiere: el servidor no dibuja.
loom {
    splitEnvironmentSourceSets()
    mods {
        "lunaeternal" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    mavenCentral()
    // Cobblemon se publica aquí. Se usa la MISMA version que corre el
    // servidor (1.7.3); el `main` del repositorio va por 1.8.0 y su API
    // puede diferir.
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Cobblemon: SOLO para compilar. No se empaqueta ni se incluye — el
    // servidor ya lo tiene, y meterlo en nuestro jar seria duplicar 130 MB
    // y arriesgarse a que dos versiones convivan.
    modCompileOnly "maven.modrinth:cobblemon:${project.cobblemon_version}"

    // Radical Cobblemon Trainers: tambien solo para compilar. De aqui salen
    // TrainerMob (la entidad del lider) y RCTMod.makeBattle (el combate).
    //
    // ⚠⚠ EL MOD ARRANCA SIN ELLOS. Todo lo que los toca vive en el paquete
    //    `gym` y se registra solo si rctmod esta cargado -- comprobado en
    //    LunaEternal con isModLoaded. Sin esa guarda, un servidor sin rctmod
    //    reventaria al arrancar con NoClassDefFoundError, que es un error que
    //    no nombra al mod que falta.
    modCompileOnly "maven.modrinth:rctapi:${project.rctapi_version}"
    modCompileOnly "maven.modrinth:rctmod:${project.rctmod_version}"

    // Cobblemon esta escrito en Kotlin y sus firmas usan tipos de Kotlin
    // (Function1). Sin el stdlib, el compilador de Java no puede resolver
    // que sobrecarga de subscribe() estamos llamando.
    // compileOnly: Cobblemon ya empaqueta Kotlin, no hay que duplicarlo.
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"

    // Persistencia (D-009). Van DENTRO del jar: el servidor no tiene classpath propio.
    // HikariCP  Apache-2.0        — compatible con uso comercial (D-008)
    // MariaDB   LGPL-2.1          — enlace dinámico, sin modificar. Compatible
    include(implementation("com.zaxxer:HikariCP:${project.hikaricp_version}"))
    include(implementation("org.mariadb.jdbc:mariadb-java-client:${project.mariadb_version}"))
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

