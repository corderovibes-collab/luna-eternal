org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# El demonio se apaga solo a los 30 min en vez de a las 3 horas.
#
# Se llegaron a acumular CINCO demonios vivos a la vez —2,1 GB— en un portatil
# de 16 GB, simplemente por compilar varias veces seguidas. Gradle no reutiliza
# un demonio de otra version, asi que cada proyecto de la maquina deja el suyo.
#
# Va AQUI y no en ~/.gradle/gradle.properties a proposito: ese fichero es
# global y lo comparte el proyecto Backrooms. Ver CLAUDE.md §9.
org.gradle.daemon.idletimeout=1800000

# Minecraft — espejo exacto del servidor (ver CLAUDE.md §3)
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.5
fabric_version=0.115.0+1.21.1

# Mod
mod_version=0.1.0
maven_group=net.pokereport
archives_base_name=lunaeternal

# Cobblemon: solo para compilar. Misma version que el servidor.
# ID de version de Modrinth, NO el numero: pidiendo "1.7.3" a secas
# Modrinth sirve el jar de NEOFORGE (mapeo Mojang) y el compilador falla con
# "cannot access ServerPlayer". kF7CvxTo es la de Fabric 1.7.3+1.21.1.
cobblemon_version=kF7CvxTo

# Dependencias de servidor (van dentro del jar con include/JiJ)
hikaricp_version=5.1.0
mariadb_version=3.4.1

# Radical Cobblemon Trainers: SOLO para compilar. Es de donde salen los
# entrenadores de gimnasio (`TrainerMob`, `RCTMod.makeBattle`), y ya esta
# instalado en el servidor y en el cliente.
#
# ⚠ IDs DE VERSION Y NO NUMEROS, por lo mismo que Cobblemon: Modrinth publica
#   el mismo numero para Fabric y para NeoForge, y el de NeoForge trae mapeo
#   Mojang -- el compilador falla con "cannot access ServerPlayer".
#     9OZx0coL = rctapi 0.15.2-beta fabric 1.21.1
#     gQx1F1dx = rctmod 0.18.1-beta fabric 1.21.1
rctapi_version=9OZx0coL
rctmod_version=gQx1F1dx
