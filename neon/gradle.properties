org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mismo motivo que en mod/gradle.properties: el demonio de Gradle se apaga solo
# a los 30 min. Cinco demonios vivos son 2,1 GB en una maquina de 16 GB, y este
# proyecto ya tiene dos builds (mod y neon) que no comparten demonio.
org.gradle.daemon.idletimeout=1800000

# Minecraft — espejo exacto del servidor. Los mismos numeros que mod/, y tienen
# que seguir siendolo: dos mods del mismo servidor compilados contra mapeos
# distintos es una fuente de fallos que no dan la cara hasta el arranque.
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.5
fabric_version=0.115.0+1.21.1

# Mod
mod_version=0.1.0
maven_group=net.pokereport
archives_base_name=lunaneon
