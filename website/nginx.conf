server {
    listen 8080;
    server_name _;
    # TLS terminates upstream: redirects must not expose this container's port.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The existing Tebex checkout returns to the origin with this status query.
    # Preserve its notification and basket handling in the original store.
    location = / {
        if ($arg_status ~ "^(success|cancelled)$") {
            return 302 /tienda/?$args;
        }
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location = /tienda { return 301 /tienda/; }
    location /tienda/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /tienda/index.html;
    }
    location /descargas/ {
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="PokeReport-Launcher-0.2.3.exe"';
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
    location ~* \.(?:css|js|jpg|jpeg|gif|webp|png|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
